name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TIMMY_HOME: ${{ github.workspace }}/.timmy-pilot/unit-profile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - name: Install locked Windows voice dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install uv==0.13.10
          uv sync --frozen --no-dev --project packages/modules/voice --python 3.12
      - name: Windows voice logic and lifecycle tests (no microphone/model download)
        if: runner.os == 'Windows'
        run: ./packages/modules/voice/.venv/Scripts/python.exe -m unittest discover -s packages/modules/voice/tests
      - name: Foreground, persistence and background smoke (local provider fixture)
        run: node scripts/windows-smoke.mjs --fixture
        env:
          TIMMY_TEST_CONSOLE: ${{ runner.os == 'Windows' && '1' || '0' }}
