name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: bun-darwin-arm64
            asset: timmy-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            asset: timmy-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun scripts/build-binary.mjs --target ${{ matrix.target }} --asset ${{ matrix.asset }}
      - name: Standalone Windows flow with Node absent from child PATH
        if: runner.os == 'Windows'
        run: node scripts/windows-smoke.mjs --fixture
        env:
          TIMMY_EXECUTABLE: ${{ github.workspace }}/release/timmy-windows-x64.exe
          TIMMY_NO_NODE_PATH: '1'
          TIMMY_TEST_CONSOLE: '1'
      - name: Installer validation
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -File scripts/windows-installer-smoke.ps1
      - name: macOS binary smoke
        if: runner.os == 'macOS'
        run: ./release/timmy-darwin-arm64 version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: node scripts/merge-checksums.mjs
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            release/timmy-darwin-arm64
            release/timmy-windows-x64.exe
            release/SHA256SUMS
            release/install.ps1
